aid: adaption
name: Adaption
description: >-
  Adaption (Adaption Labs) is a San Francisco AI research company building
  adaptive, continuously-learning AI systems rather than relying on ever-larger
  static models. Founded in 2026 by former Cohere leaders Sara Hooker and Sudip
  Roy, it exited stealth with a $50M seed round led by Emergence Capital. Its
  first product, Adaptive Data, exposes a REST API and official Python SDK to
  ingest, adapt, evaluate, and export model-ready training datasets — folding
  data-optimization techniques usually reserved for frontier labs into a
  self-serve workflow for everyday teams.
